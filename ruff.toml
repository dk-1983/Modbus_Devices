required-version = ">=0.16.0"
target-version = "py313"
line-length = 88

[lint]
# Release-blocking correctness rules. Broader style cleanup remains separate
# from the pre-1.0 safety gate.
select = ["E9", "F63", "F7", "F82"]

[format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
